name: Mini Task Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
    contents: read
    packages: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  

  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/codepro233/mini-task-manager-frontend:latest .
      - name: Push frontend Docker image
        run: docker push ghcr.io/codepro233/mini-task-manager-frontend:latest
      - name: Build backend Docker image
        run: docker build -t ghcr.io/codepro233/mini-task-manager-backend:latest ./backend
      - name: Push backend Docker image
        run: docker push ghcr.io/codepro233/mini-task-manager-backend:latest
